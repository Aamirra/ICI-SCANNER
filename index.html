<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ICI Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg); color:var(--txt); padding:16px; display:flex; justify-content:center; min-height:100vh; }
        [data-theme="light"] { --bg:#f8fafc; --surface:#fff; --border:#e2e8f0; --txt:#0f172a; --acc:#0062ff; --green:#22c55e; --red:#ef4444; --gold:#f59e0b; --muted:#64748b; --pill-bg:#f1f5f9; }
        [data-theme="dark"] { --bg:#0f172a; --surface:#1e293b; --border:#334155; --txt:#f8fafc; --acc:#3b82f6; --green:#22c55e; --red:#ef4444; --gold:#f59e0b; --muted:#94a3b8; --pill-bg:#1e293b; }
        .phone-container { width:100%; max-width:450px; background:var(--surface); border-radius:24px; box-shadow:0 10px 30px rgba(0,0,0,0.05); padding:16px; border:1px solid var(--border); }
        .header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        .brand { display:flex; align-items:center; gap:10px; }
        .brand-icon { width:36px; height:36px; background:var(--acc); border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px; font-weight:bold; }
        .brand-text h1 { font-size:16px; font-weight:700; line-height:1.2; }
        .brand-text span { font-size:12px; color:var(--muted); }
        .header-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .icon-btn { width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--txt); }
        .alert-toggle { padding:4px 10px; border-radius:12px; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--pill-bg); color:var(--txt); }
        .alert-toggle.active { background:var(--green); color:#fff; border-color:var(--green); }
        .alert-toggle.inactive { background:var(--red); color:#fff; border-color:var(--red); }
        .pills-row { display:flex; gap:8px; margin-bottom:12px; align-items:center; flex-wrap:wrap; }
        .pill { padding:6px 14px; border-radius:20px; font-size:13px; font-weight:600; border:1px solid var(--border); background:var(--pill-bg); cursor:pointer; color:var(--txt); text-decoration:none; display:inline-block; }
        .pill.active-blue { background:var(--acc); color:#fff; border-color:var(--acc); }
        .pill.scan-btn { background:var(--acc); color:#fff; display:flex; align-items:center; gap:4px; }
        .cloud-status { background:var(--pill-bg); color:var(--green); font-size:12px; padding:6px 12px; border-radius:20px; margin-left:auto; font-weight:500; }
        .sync-info { font-size:12px; color:var(--green); display:flex; align-items:center; gap:4px; margin-bottom:16px; font-weight:500; cursor:pointer; }
        .counters-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin-bottom:16px; }
        .count-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:8px 4px; text-align:center; cursor:pointer; }
        .count-card .num { font-size:18px; font-weight:700; margin-bottom:2px; color:var(--txt); }
        .count-card .label { font-size:10px; color:var(--muted); font-weight:500; }
        .search-container { margin-bottom:16px; }
        .search-bar { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:12px; font-size:14px; outline:none; background:var(--pill-bg); color:var(--txt); }
        .table-header { display:flex; justify-content:space-between; padding:0 8px 8px 8px; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; border-bottom:1px solid var(--border); }
        .row-pair { width:22%; } .row-timeframes { width:28%; text-align:center; } .row-sentiment { width:22%; text-align:center; } .row-change { width:16%; text-align:right; } .row-alert { width:12%; text-align:center; }
        .item-row { border-bottom:1px solid var(--border); }
        .item-main { display:flex; justify-content:space-between; align-items:center; padding:12px 8px 6px 8px; cursor:pointer; transition:background 0.2s; -webkit-user-select:none; user-select:none; touch-action: pan-y; }
        .item-main:active { background:var(--pill-bg); }
        .pair-title { font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dots-container { display:flex; gap:4px; justify-content:center; }
        .trend-dot { width:8px; height:8px; border-radius:50%; }
        .trend-dot.g { background:var(--green); } .trend-dot.r { background:var(--red); }
        .sentiment-wrapper { padding:0 4px; }
        .sentiment-progress { height:14px; border-radius:4px; display:flex; overflow:hidden; font-size:9px; font-weight:700; color:#fff; line-height:14px; text-align:center; }
        .sent-red { background:var(--red); } .sent-green { background:var(--green); }
        .change-val { font-size:13px; font-weight:600; }
        .change-val.up { color:var(--green); } .change-val.down { color:var(--red); }
        .compact-details { display:flex; justify-content:space-between; align-items:center; padding:4px 8px 10px 8px; font-size:10px; color:var(--muted); gap:6px; flex-wrap:wrap; }
        .compact-metric { display:flex; align-items:center; gap:3px; white-space:nowrap; }
        .compact-metric .lbl { text-transform:uppercase; font-weight:500; color:var(--muted); }
        .compact-metric .val { font-weight:600; color:var(--txt); }
        .compact-metric .val.up { color:var(--green); } .compact-metric .val.down { color:var(--red); }
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:500; display:none; align-items:flex-end; justify-content:center; padding:16px; }
        .modal.open { display:flex; }
        .modal-content { background:var(--surface); border-radius:20px; padding:20px; width:100%; max-width:400px; max-height:80vh; overflow-y:auto; color:var(--txt); }
        body.desktop-mode { padding:0; height:100vh; overflow:hidden; }
        body.desktop-mode .phone-container { max-width:none; width:640px; height:100vh; overflow-y:auto; border-radius:0; box-shadow:none; margin:0; flex-shrink:0; border-right:1px solid var(--border); }
        body.desktop-mode #chartOverlay { position:relative !important; display:flex !important; flex:1; height:100vh; z-index:1 !important; background:var(--bg); }
        body.desktop-mode .chart-box { min-height:0; }
        body.desktop-mode #chartCloseBtn { display:none !important; }
        
        .chart-grid { display: grid; gap: 4px; width: 100%; flex: 1; min-height: 0; background: var(--border); padding: 4px; }
        .layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .layout-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
        .layout-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .layout-3 .chart-box:nth-child(3) { grid-column: span 2; }
        .layout-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .chart-box { min-height: 0; min-width: 0; display: none; background: var(--bg); }
        .chart-box.active { display: block; }
        
        .layout-controls { display: flex; gap: 6px; padding: 6px 10px; align-items: center; justify-content: center; background: var(--surface); border-bottom: 1px solid var(--border); }
        .layout-btn { padding: 4px 12px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--pill-bg); border-radius: 6px; cursor: pointer; color: var(--txt); }
        .layout-btn.active { background: var(--acc); color: #fff; border-color: var(--acc); }
        
        .slot-selector { display: flex; gap: 4px; align-items: center; margin: 0 10px; }
        .slot-btn { padding: 4px 8px; font-size: 11px; font-weight: 600; border: 2px solid transparent; border-radius: 4px; background: var(--pill-bg); cursor: pointer; color: var(--txt); }
        .slot-btn.active-slot { border-color: var(--green); color: var(--green); }

        body.desktop-mode .chart-box:empty { display:flex !important; align-items:center; justify-content:center; gap:12px; }
        body.desktop-mode .chart-box:empty::before { content:'\f080'; font-size:44px; opacity:0.2; font-family:"Font Awesome 6 Free"; font-weight:900; }
        body.desktop-mode .chart-box:empty::after { content:'Select a pair to view chart'; font-family:'Inter',sans-serif; font-size:12px; color:var(--muted); opacity:0.5; }
        
        .toggle-4h { cursor:pointer; padding:2px 8px; border-radius:12px; background:var(--pill-bg); font-weight:600; margin-left:8px; font-size:11px; color:var(--muted); user-select:none; }
        .toggle-4h.active { background:var(--acc); color:#fff; }
        .phase-row { padding:4px 8px 8px 8px; display:flex; align-items:center; gap:6px; font-size:11px; }
        .chart-interval-selector { display: flex; gap: 6px; align-items: center; }
        .chart-interval-btn { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--pill-bg); color: var(--txt); cursor: pointer; }
        .chart-interval-btn.active { background: var(--acc); color: #fff; border-color: var(--acc); }
        .countdown-display { font-size:11px; font-weight:600; margin-left:8px; color:var(--gold); white-space:nowrap; }
        .ai-assistant-panel { background: var(--surface); border: 1px solid var(--acc); border-radius: 12px; margin-bottom: 12px; font-size: 12px; overflow: hidden; }
        .ai-header { padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: var(--acc); cursor: pointer; background: var(--pill-bg); }
        .ai-body { max-height: 300px; overflow-y: auto; transition: max-height 0.3s; }
        .ai-body.collapsed { max-height: 0; }
        .error-list-embedded { padding: 4px 12px; border-bottom: 1px solid var(--border); display: none; }
        .error-list-embedded.has-errors { display: block; }
        .error-item { padding: 4px 0; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 11px; }
        .chat-section { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
        .chat-messages-embedded { max-height: 120px; overflow-y: auto; font-size: 11px; background: var(--pill-bg); border-radius: 8px; padding: 6px; }
        .chat-message-embedded { margin-bottom: 6px; }
        .chat-message-embedded.user { text-align: right; }
        .chat-message-embedded.assistant { text-align: left; }
        .chat-message-embedded span { display: inline-block; padding: 4px 8px; border-radius: 10px; max-width: 85%; word-wrap: break-word; }
        .chat-message-embedded.user span { background: var(--acc); color: #fff; }
        .chat-message-embedded.assistant span { background: var(--surface); color: var(--txt); border: 1px solid var(--border); }
        .chat-input-embedded { display: flex; gap: 6px; }
        .chat-input-embedded input { flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; background: var(--pill-bg); color: var(--txt); outline: none; }
        .chat-input-embedded button { padding: 6px 10px; background: var(--acc); color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .pending-code-changes { background: var(--surface); border: 1px solid var(--gold); border-radius: 12px; margin-bottom: 12px; padding: 8px 12px; font-size: 12px; display: none; }
        .pending-code-changes.visible { display: block; }
        .pending-header { font-weight: 600; color: var(--gold); margin-bottom: 6px; }
        .pending-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
        .pending-item button { margin-left: 6px; padding: 4px 8px; border-radius: 6px; border: none; color: #fff; font-size: 11px; font-weight: 600; cursor: pointer; }
        .btn-approve { background: var(--green); }
        .btn-reject { background: var(--red); }
        .approval-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:2000; display:none; align-items:center; justify-content:center; }
        .approval-overlay.open { display:flex; }
        .approval-box { background:var(--surface); border-radius:16px; padding:20px; max-width:360px; width:90%; color:var(--txt); }
        .approval-box h3 { margin:0 0 8px; font-size:16px; }
        .approval-box p { font-size:13px; color:var(--muted); margin-bottom:16px; }
        .approval-btns { display:flex; gap:8px; justify-content:flex-end; }
        .approval-btns button { padding:8px 16px; border-radius:8px; border:none; font-weight:600; cursor:pointer; }
        .approve-btn { background:var(--green); color:#fff; }
        .reject-btn { background:var(--red); color:#fff; }
        .scan-status-line { font-size:11px; color: var(--muted); margin-left:8px; }
        .last-scan-line { font-size:11px; color: var(--gold); margin-left:auto; }

        /* ── Customizable column screener ── */
        .screener-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -16px; padding:0 16px; }
        .header-row-table { display:flex; align-items:center; min-width:max-content; padding-bottom:8px; border-bottom:1px solid var(--border); }
        .col-header-cell { min-width:88px; padding:0 6px; font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.3px; display:flex; align-items:center; justify-content:center; gap:3px; cursor:pointer; flex-shrink:0; -webkit-user-select:none; user-select:none; }
        .col-header-cell:active { color:var(--acc); }
        .col-pair-fixed.col-header-cell { position:sticky; left:0; z-index:3; background:var(--surface); min-width:110px; justify-content:flex-start; cursor:default; }
        .col-bell-fixed.col-header-cell { position:sticky; right:0; z-index:3; background:var(--surface); min-width:34px; cursor:default; }
        .col-add-btn { min-width:30px; text-align:center; cursor:pointer; color:var(--acc); font-size:16px; flex-shrink:0; }
        .sort-arrow { font-size:8px; color:var(--acc); }
        .filter-badge { background:var(--gold); color:#fff; border-radius:8px; font-size:8px; font-weight:700; padding:1px 4px; }
        .item-main { min-width:max-content; justify-content:flex-start !important; }
        .col-pair-fixed { position:sticky; left:0; z-index:2; background:var(--surface); min-width:110px; display:flex; align-items:center; padding-right:6px; }
        .col-bell-fixed { position:sticky; right:0; z-index:2; background:var(--surface); min-width:34px; display:flex; align-items:center; justify-content:center; }
        .col-cell { min-width:88px; padding:0 6px; text-align:center; flex-shrink:0; font-size:12px; }
        body.desktop-mode .header-row-table, body.desktop-mode .item-main { min-width:100%; }
        body.desktop-mode .col-cell, body.desktop-mode .col-header-cell:not(.col-pair-fixed):not(.col-bell-fixed) { flex:1 1 88px; }

        .sheet-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1500; display:none; align-items:flex-end; justify-content:center; }
        .sheet-overlay.open { display:flex; }
        .sheet-box { background:var(--surface); border-radius:16px 16px 0 0; width:100%; max-width:450px; padding:8px 0; color:var(--txt); }
        .sheet-item { padding:14px 20px; font-size:14px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); }
        .sheet-item:last-child { border-bottom:none; color:var(--red); }
        .sheet-item:active { background:var(--pill-bg); }

        .form-group { margin-bottom:12px; }
        .form-label { font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; display:block; }
        .form-select, .form-input { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; background:var(--pill-bg); color:var(--txt); font-size:14px; outline:none; }
        .form-row-btns { display:flex; gap:8px; margin-top:16px; }
        .form-row-btns button { flex:1; padding:10px; border-radius:8px; border:none; font-weight:600; font-size:14px; cursor:pointer; }
        .btn-primary { background:var(--acc); color:#fff; }
        .btn-secondary { background:var(--pill-bg); color:var(--txt); border:1px solid var(--border); }
        .filter-row { display:flex; gap:8px; }
    </style>
</head>
<body>
<div class="phone-container" id="app">
    <div class="header-row">
        <div class="brand"><div class="brand-icon"><i class="fas fa-chart-line"></i></div><div class="brand-text"><h1>ICI Screener</h1><span>clean v2</span></div></div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn"><i class="fas fa-moon"></i></button>
            <button class="icon-btn" onclick="toggleDesktopMode()" id="desktopBtn"><i class="fas fa-desktop"></i></button>
            <button class="alert-toggle" id="tgToggle" onclick="toggleAlert('telegram')">TG</button>
            <button class="alert-toggle" id="waToggle" onclick="toggleAlert('whatsapp')">WA</button>
        </div>
    </div>
    <div class="pills-row">
        <button class="pill active-blue" onclick="setFilter('all')">Forex</button>
        <a href="/stocks" class="pill" style="text-decoration:none">Stocks</a>
        <a href="/crypto" class="pill" style="text-decoration:none">Crypto</a>
        <a href="/journal" class="pill" style="text-decoration:none">📒 Journal</a>
        <button class="pill scan-btn" onclick="actualScan()">Scan</button>
        <button class="pill" onclick="openAlertsList()" style="background:var(--gold); color:#fff; border-color:var(--gold);">Alerts</button>
        <div class="cloud-status" id="statusDot">Cloud active</div>
    </div>
    <div style="display:flex; align-items:center; margin-bottom:8px;">
        <span id="scanStatusText" class="scan-status-line"></span>
        <span id="lastScanTime" class="last-scan-line">🕒 Last scan: never</span>
    </div>
    <div class="ai-assistant-panel">
        <div class="ai-header" onclick="toggleAIAssistant()"><span>AI Assistant</span><i class="fas fa-chevron-down" style="font-size:12px;"></i></div>
        <div class="ai-body" id="aiBody">
            <div style="display:flex; justify-content:space-between; align-items:center; padding: 4px 12px; border-bottom:1px solid var(--border);">
                <span style="font-weight:600;color:var(--muted);font-size:11px;">Errors</span>
                <button onclick="clearErrors()" style="background:var(--red);color:#fff;border:none;border-radius:4px;padding:2px 8px;font-size:10px;cursor:pointer">Clear</button>
            </div>
            <div class="error-list-embedded" id="errorListEmbedded"></div>
            <div class="chat-section">
                <div class="chat-messages-embedded" id="chatMessagesEmbedded"></div>
                <div class="chat-input-embedded">
                    <input type="text" id="chatInputEmbedded" placeholder="Ask AI anything..." onkeypress="if(event.key==='Enter') sendOpenRouterChat()">
                    <button onclick="sendOpenRouterChat()">Send</button>
                </div>
            </div>
        </div>
    </div>
    <div class="pending-code-changes" id="pendingCodePanel">
        <div class="pending-header">Pending Code Changes (<span id="pendingCodeCount">0</span>)</div>
        <div id="pendingCodeList"></div>
    </div>
    <div class="sync-info" onclick="openTargetModal()">
        Cloud synced <span style="color:var(--acc);margin-left:6px;">Target list: <span id="targetCount">0</span> ></span>
        <span class="toggle-4h active" id="toggle4hBtn" onclick="event.stopPropagation(); toggle4H()">4H ON</span>
    </div>
    <div class="counters-grid">
        <div class="count-card" onclick="setFilter('bull')"><div class="num" style="color:var(--green)" id="bc">0</div><div class="label">Bullish</div></div>
        <div class="count-card" onclick="setFilter('bear')"><div class="num" style="color:var(--red)" id="rc">0</div><div class="label">Bearish</div></div>
        <div class="count-card" onclick="setFilter('all')"><div class="num" style="color:var(--txt)" id="allCount">0</div><div class="label">All</div></div>
        <div class="count-card" onclick="setFilter('target')"><div class="num" style="color:var(--gold)" id="targetCount2">0</div><div class="label">Target</div></div>
        <div class="count-card" onclick="setFilter('trades')"><div class="num" style="color:var(--gold)" id="tradesCount">0</div><div class="label">Trades</div></div>
    </div>
    <div class="search-container"><input type="text" class="search-bar" placeholder="Search pairs..." oninput="filterPairs(this.value)"></div>
    <div class="screener-wrap">
        <div class="header-row-table" id="tableHeaderRow"></div>
        <div id="pairsContainer"></div>
    </div>
</div>

<!-- Column context menu (bottom sheet) -->
<div class="sheet-overlay" id="colMenuSheet" onclick="if(event.target===this) closeColMenu()">
    <div class="sheet-box" id="colMenuBox"></div>
</div>

<!-- Add / Edit column modal -->
<div class="modal" id="colEditModal" onclick="if(event.target===this) closeColEditModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 style="margin-bottom:16px;" id="colEditTitle">Add Column</h3>
        <div class="form-group">
            <label class="form-label">Column Type</label>
            <select class="form-select" id="colTypeSelect" onchange="onColTypeChange()"></select>
        </div>
        <div class="form-group">
            <label class="form-label">Label (optional)</label>
            <input class="form-input" id="colLabelInput" placeholder="Custom label">
        </div>
        <div class="form-group" id="colDisplayStyleGroup" style="display:none;">
            <label class="form-label">Display Style</label>
            <select class="form-select" id="colDisplayStyleSelect">
                <option value="colored">Colored text</option>
                <option value="mono">Monochrome text</option>
            </select>
        </div>
        <div class="form-row-btns">
            <button class="btn-secondary" onclick="closeColEditModal()">Cancel</button>
            <button class="btn-primary" onclick="saveColumnFromModal()">Save</button>
        </div>
    </div>
</div>

<!-- Column filter modal -->
<div class="modal" id="colFilterModal" onclick="if(event.target===this) closeColFilterModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 style="margin-bottom:16px;">Filter Column</h3>
        <div class="form-group filter-row">
            <div style="flex:1"><label class="form-label">Min</label><input class="form-input" id="filterMinInput" type="number" placeholder="Min"></div>

(function() {
    const originalFire = _alFireAlert;
    _alFireAlert = function(alert, pair) {
        if (alert.value != null && alert.type) {
            const direction = alert.type === 'above' ? 'crossed above' : 'crossed below';
            if (!alert.message) alert.message = pair.name + ' ' + direction + ' ' + alert.value;
        }
        originalFire(alert, pair);
        alert.active = false;
        try {
            if (typeof alSaveAlerts === 'function') {
                const all = alLoadAlerts();
                const idx = all.findIndex(a => a.id === alert.id);
                if (idx !== -1) {
                    all[idx].active = false;
                    alSaveAlerts(all);
                }
            } else if (typeof saveAlerts === 'function') {
                saveAlerts();
            } else {
                const key = 'ici_alerts';
                const raw = localStorage.getItem(key);
                if (raw) {
                    const list = JSON.parse(raw);
                    const i = list.findIndex(a => a.id === alert.id);
                    if (i !== -1) {

                        localStorage.setItem(key, JSON.stringify(list));

            }

let countdownInterval = null;

function updateCountdown() {
    const intervalStr = chartIntervals[activeChartSlot-1];
    let ms = 0;
    if (intervalStr === 'D') {
        const now = new Date();
        const end = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1));
        ms = end - now;
    } else if (intervalStr === 'W') {
        const now = new Date();
        const day = now.getUTCDay();
        const daysUntilMonday = day === 1 ? 7 : (8 - day) % 7;
        const end = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + daysUntilMonday));
        ms = end - now;
    } else {
        const minutes = parseInt(intervalStr) || 60;
        const periodMs = minutes * 60 * 1000;
        const elapsed = Date.now() % periodMs;
        ms = periodMs - elapsed;
    }
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const text = h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
    document.getElementById('countdownDisplay').textContent = '⏳ ' + text;
}

function startCountdownTimer() {
    if (countdownInterval) clearInterval(countdownInterval);
    updateCountdown();
    countdownInterval = setInterval(updateCountdown, 1000);
}

function actualScan() {

    btn.disabled = true;
    statusEl.textContent = 'Scan started (may take 2‑3 min)...';

    fetch('/scan').catch(() => {});

    const statusRef = db.ref('scanStatus');
    let resolved = false;
    const listener = statusRef.on('value', snap => {
        const s = snap.val();
        if (!s) return;
        if (s.running === false && !resolved) {
            resolved = true;
            statusRef.off('value', listener);
            const now = new Date();
            btn.textContent = '✅ Done';
            btn.disabled = false;
            db.ref('lastScanTime').set({ time: now.getTime() });
            statusEl.textContent = '✅ Scan completed at ' + now.toLocaleTimeString();
            setTimeout(() => { btn.textContent = 'Scan'; }, 4000);

            const startTime = s.startedAt ? new Date(s.startedAt).toLocaleTimeString() : '?';
            statusEl.textContent = '🔄 Scanning in progress... (started ' + startTime + ')';
        }
    });

    setTimeout(() => {
        if (!resolved) {
            statusRef.off('value', listener);
            btn.textContent = 'Scan';
            btn.disabled = false;
            statusEl.textContent = '⚠️ Scan timeout (>10 min) – check backend';
            resolved = true;
        }
    }, 600000);
}

// ==================== CUSTOM COLUMN SYSTEM ====================

const COLUMN_TYPES = {
    tf_alignment: { label:'TF Alignment',      kind:'dots', filterable:false },
    sentiment:    { label:'Sentiment',         kind:'bar',  filterable:false },
    change_200:   { label:'200 Candle Change', kind:'pct',  field:'longTermTrend',    filterable:true },
    change_10:    { label:'10 Candle Change',  kind:'pct',  field:'shortTermMomentum',filterable:true },
    change_1h:    { label:'1H Momentum',       kind:'pct',  field:'microMomentum',    filterable:true },
    vol_7d:       { label:'Vol 7D Avg',        kind:'num',  field:'volume7dAvg',      filterable:true },
    dollar_vol:   { label:'$ Volume 1D',       kind:'num',  field:'dollarVolume1d',   filterable:true },
    price:        { label:'Price',             kind:'num',  field:'price',            filterable:true }
};

let columnDefs = [];
let sortColumn = null, sortDir = 'desc';
let colMenuTargetId = null, filterTargetId = null;

function defaultColumns() {
    return [
        { id:'c_tf',   type:'tf_alignment', label:'1H/4H/1D/1W' },
        { id:'c_sent', type:'sentiment',    label:'Sentiment' },
        { id:'c_200',  type:'change_200',   label:'200C', style:'colored', filterMin:null, filterMax:null }
    ];
}
function loadColumns() {
    try {
        const raw = localStorage.getItem('ici_columns');
        if (raw) { const parsed = JSON.parse(raw); if (Array.isArray(parsed) && parsed.length) return parsed; }
    } catch(e) {}
    return defaultColumns();
}
function saveColumns() { localStorage.setItem('ici_columns', JSON.stringify(columnDefs)); }
columnDefs = loadColumns();

function getColumnValue(pairName, col) {
    const type = COLUMN_TYPES[col.type];
    const t = techMetrics[pairName] || {};
    const s = sentimentData[pairName] || {};
    const m = MARKET_DATA[pairName] || {};
    const lm = liveMarketData[pairName] || {};
    if (col.type === 'tf_alignment') {
        return ['1h','4h','1day','1week'].map(tf => m[tf] || (lm[tf] || ''));
    }
    if (col.type === 'sentiment') {
        const bullPct = s.bullish_pct || 0, bearPct = s.bearish_pct || 0, total = bullPct + bearPct || 1;
        return { bullPct: Math.round((bullPct/total)*100), bearPct: Math.round((bearPct/total)*100) };
    }
    if (col.type === 'price') return (lm.price || lm.currentPrice || m.price || m.currentPrice || null);
    return t[type.field] != null ? t[type.field] : null;
}

function sortValueFor(pairName, col) {
    const v = getColumnValue(pairName, col);
    if (typeof v === 'number') return v;
    if (v && typeof v === 'object' && 'bullPct' in v) return v.bullPct;
    return null;
}

function applyColumnSortAndFilter(list) {
    let out = list;
    columnDefs.forEach(col => {
        if (col.filterMin == null && col.filterMax == null) return;
        out = out.filter(p => {
            const v = sortValueFor(p.n, col);
            if (v == null) return false;
            if (col.filterMin != null && v < col.filterMin) return false;
            if (col.filterMax != null && v > col.filterMax) return false;
            return true;
        });
    });
    if (sortColumn) {
        const col = columnDefs.find(c => c.id === sortColumn);
        if (col) {
            out = [...out].sort((a,b) => {
                const va = sortValueFor(a.n, col), vb = sortValueFor(b.n, col);
                const na = va == null ? -Infinity : va, nb = vb == null ? -Infinity : vb;
                return sortDir === 'desc' ? nb - na : na - nb;
            });
        }
    }
    return out;
}

function renderHeader() {
    let html = '<div class="col-pair-fixed col-header-cell">Pair</div>';
    columnDefs.forEach(col => {
        const type = COLUMN_TYPES[col.type];
        let arrow = sortColumn === col.id ? `<span class="sort-arrow">${sortDir === 'desc' ? '▼' : '▲'}</span>` : '';
        let badge = (col.filterMin != null || col.filterMax != null) ? '<span class="filter-badge">F</span>' : '';
        html += `<div class="col-header-cell" onclick="openColMenu('${col.id}')">${col.label || type.label}${arrow}${badge}</div>`;
    });
    html += `<div class="col-add-btn" onclick="openColEditModal(null)"><i class="fas fa-plus-circle"></i></div>`;
    html += '<div class="col-bell-fixed col-header-cell"><i class="fas fa-bell"></i></div>';
    document.getElementById('tableHeaderRow').innerHTML = html;
}

function renderColumnCell(pairName, col) {
    const type = COLUMN_TYPES[col.type];
    const val = getColumnValue(pairName, col);
    if (col.type === 'tf_alignment') {
        const dots = val.map(sig => `<span class="trend-dot" style="background:${sig === 'bull' ? 'var(--green)' : (sig === 'bear' ? 'var(--red)' : '#cbd5e1')}"></span>`).join('');
        return `<div class="col-cell dots-container">${dots}</div>`;
    }
    if (col.type === 'sentiment') {
        return `<div class="col-cell"><div class="sentiment-progress"><div class="sent-red" style="width:${val.bearPct}%">${val.bearPct}%</div><div class="sent-green" style="width:${val.bullPct}%">${val.bullPct}%</div></div></div>`;
    }
    if (val == null) return `<div class="col-cell" style="color:var(--muted)">--</div>`;
    if (type.kind === 'pct') {
        const cls = col.style === 'mono' ? '' : (val >= 0 ? 'up' : 'down');
        return `<div class="col-cell change-val ${cls}">${val > 0 ? '+' : ''}${val.toFixed(2)}%</div>`;
    }
    if (col.type === 'price') return `<div class="col-cell">${val.toFixed(4)}</div>`;
    return `<div class="col-cell">${typeof val === 'number' ? val.toLocaleString() : val}</div>`;
}

// ── Column menu (bottom sheet: sort / edit / filter / delete) ──
function openColMenu(colId) {
    colMenuTargetId = colId;
    const col = columnDefs.find(c => c.id === colId);
    if (!col) return;
    const type = COLUMN_TYPES[col.type];
    let items = `<div class="sheet-item" onclick="sortByColumn('desc')"><i class="fas fa-sort-amount-down"></i> Sort: Highest first</div>
                 <div class="sheet-item" onclick="sortByColumn('asc')"><i class="fas fa-sort-amount-up"></i> Sort: Lowest first</div>
                 <div class="sheet-item" onclick="openColEditModal('${colId}')"><i class="fas fa-edit"></i> Edit column</div>`;
    if (type.filterable) items += `<div class="sheet-item" onclick="openColFilterModal('${colId}')"><i class="fas fa-filter"></i> Filter</div>`;
    items += `<div class="sheet-item" onclick="deleteColumn('${colId}')"><i class="fas fa-trash"></i> Delete column</div>
              <div class="sheet-item" onclick="closeColMenu()" style="color:var(--txt);"><i class="fas fa-times"></i> Cancel</div>`;
    document.getElementById('colMenuBox').innerHTML = items;
    document.getElementById('colMenuSheet').classList.add('open');
}
function closeColMenu() { document.getElementById('colMenuSheet').classList.remove('open'); }
function sortByColumn(dir) {
    sortColumn = colMenuTargetId; sortDir = dir;
    closeColMenu(); render();
}
function deleteColumn(colId) {
    columnDefs = columnDefs.filter(c => c.id !== colId);
    if (sortColumn === colId) sortColumn = null;
    saveColumns(); closeColMenu(); render();
}

// ── Add / Edit column modal ──
function openColEditModal(colId) {
    closeColMenu();
    const isEdit = !!colId;
    document.getElementById('colEditTitle').textContent = isEdit ? 'Edit Column' : 'Add Column';
    const sel = document.getElementById('colTypeSelect');
    sel.innerHTML = Object.entries(COLUMN_TYPES).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('');
    sel.dataset.editId = colId || '';
    if (isEdit) {
        const col = columnDefs.find(c => c.id === colId);
        sel.value = col.type;
        document.getElementById('colLabelInput').value = col.label || '';
        document.getElementById('colDisplayStyleSelect').value = col.style || 'colored';
    } else {
        document.getElementById('colLabelInput').value = '';
        document.getElementById('colDisplayStyleSelect').value = 'colored';
    }
    onColTypeChange();
    document.getElementById('colEditModal').classList.add('open');
}
function onColTypeChange() {
    const type = COLUMN_TYPES[document.getElementById('colTypeSelect').value];
    document.getElementById('colDisplayStyleGroup').style.display = type.kind === 'pct' ? 'block' : 'none';
}
function closeColEditModal() { document.getElementById('colEditModal').classList.remove('open'); }
function saveColumnFromModal() {
    const sel = document.getElementById('colTypeSelect');
    const editId = sel.dataset.editId;
    const type = sel.value;
    const label = document.getElementById('colLabelInput').value.trim();
    const style = document.getElementById('colDisplayStyleSelect').value;
    if (editId) {
        const col = columnDefs.find(c => c.id === editId);
        col.type = type; col.label = label; col.style = style;
    } else {
        columnDefs.push({ id:'c_'+Date.now(), type, label, style, filterMin:null, filterMax:null });
    }
    saveColumns(); closeColEditModal(); render();
}

// ── Filter modal ──
function openColFilterModal(colId) {
    closeColMenu();
    filterTargetId = colId;
    const col = columnDefs.find(c => c.id === colId);
    document.getElementById('filterMinInput').value = col.filterMin ?? '';
    document.getElementById('filterMaxInput').value = col.filterMax ?? '';
    document.getElementById('colFilterModal').classList.add('open');
}
function closeColFilterModal() { document.getElementById('colFilterModal').classList.remove('open'); }
function applyColFilter() {
    const col = columnDefs.find(c => c.id === filterTargetId);
    const minV = document.getElementById('filterMinInput').value;
    const maxV = document.getElementById('filterMaxInput').value;
    col.filterMin = minV === '' ? null : parseFloat(minV);
    col.filterMax = maxV === '' ? null : parseFloat(maxV);
    saveColumns(); closeColFilterModal(); render();
}
function clearColFilter() {
    const col = columnDefs.find(c => c.id === filterTargetId);
    col.filterMin = null; col.filterMax = null;
    saveColumns(); closeColFilterModal(); render();
}

// ── RENDER (with crash guard) ──
function render() {
    // DO NOT update the pair list if chart overlay is open (prevents mobile crash)
    if (document.getElementById('chartOverlay').style.display === 'flex') return;

    const currentPairs = filteredPairs.length ? filteredPairs : PAIRS;
    let filtered;
    const validTargets = new Set(getUniqueAutoSetups().keys());
    if (curF === 'all') filtered = currentPairs;
    else if (curF === 'bull' || curF === 'bear')
        filtered = currentPairs.filter(p => {
            const d = MARKET_DATA[p.n] || {};
            return ['4h','1day','1week'].every(tf => d[tf] === curF);
        });
    else if (curF === 'target' || curF === 'trades')
        filtered = currentPairs.filter(p => validTargets.has(p.n));
    else filtered = currentPairs;

    filtered = applyColumnSortAndFilter(filtered);

    currentDisplayPairs = filtered.map(p => p.n);
    chartPairs = filtered.map(p => p.n); // sync chartPairs with current filter

    renderHeader();

    document.getElementById('pairsContainer').innerHTML = filtered.map(p => {
        const m = MARKET_DATA[p.n] || {};
        const isBull = ['4h','1day','1week'].every(tf => m[tf] === 'bull'),
              isBear = ['4h','1day','1week'].every(tf => m[tf] === 'bear');
        const star = isBull ? 'B' : (isBear ? 'S' : 'N'),
              starColor = isBull ? 'var(--green)' : (isBear ? 'var(--red)' : '#cbd5e1');
        const lm = liveMarketData && liveMarketData[p.n];
        const mktPrice = (m.price || m.currentPrice);
        const livePrice = (lm && (lm.price || lm.currentPrice)) ? (lm.price || lm.currentPrice).toFixed(4) : (mktPrice ? mktPrice.toFixed(4) : '');
        const priceHTML = livePrice ? ` <span style="font-size:10px;color:var(--muted);margin-left:4px;">${livePrice}</span>` : '';

        let cells = `<div class="col-pair-fixed">
            <span style="color:${starColor};font-weight:700;margin-right:4px;">${star}</span>
            <span style="font-weight:700;font-size:14px;">${p.n}</span>${priceHTML}
        </div>`;
        cells += columnDefs.map(col => renderColumnCell(p.n, col)).join('');
        cells += `<div class="col-add-btn" style="visibility:hidden;"></div>`;
        cells += `<div class="col-bell-fixed">${getBellHtml(p.n)}</div>`;

        let row = `<div class="item-row"><div class="item-main" onclick="openChartForPair('${p.n}')">${cells}</div>`;

        if (curF === 'target' || curF === 'trades') {
            const info = getUniqueAutoSetups().get(p.n);
            if (info) {
                const badgeBg = info.dir === 'bull' ? '#22c55e' : '#ef4444';
                row += `<div class="phase-row" style="position:sticky;left:0;"><span style="color:var(--muted);">Phase:</span>
                    <span style="background:${badgeBg};color:#fff;padding:2px 10px;border-radius:4px;font-size:10px;font-weight:700;">${info.dir.toUpperCase()} ${info.phase}</span>
                </div>`;
            }
        }
        row += '</div>';
        return row;
    }).join('');
    updateCounts();
}

// ==================== MULTI-CHART LOGIC ====================

function activateChartSlot(slot) {
    activeChartSlot = slot;
    for (let i = 1; i <= 4; i++) {
        const btn = document.getElementById('slotBtn' + i);
        if (i === slot) btn.classList.add('active-slot');
        else btn.classList.remove('active-slot');
    }
    updateChartPairName();
    highlightIntervalButton(chartIntervals[slot-1]);
    startCountdownTimer();
}

function updateChartPairName() {
    const idx = chartIndices[activeChartSlot-1];
    const pair = chartPairs[idx] || 'Select a pair';
    document.getElementById('chartPairName').textContent = (currentChartLayout > 1 ? `[Slot ${activeChartSlot}] ` : '') + pair;
}

function highlightIntervalButton(interval) {
    document.querySelectorAll('.chart-interval-btn').forEach(btn => {
        if (btn.dataset.interval === interval) btn.classList.add('active');
        else btn.classList.remove('active');
    });
}

function openChartForPair(pairName) {
    chartPairs = currentDisplayPairs.length ? currentDisplayPairs : PAIRS.map(p => p.n);
    let index = chartPairs.indexOf(pairName);
    if (index === -1) index = 0;
    chartIndices[activeChartSlot-1] = index;
    updateChartPairName();
    drawChart(activeChartSlot);
    document.getElementById('chartOverlay').style.display = 'flex';
    startCountdownTimer();
}

function movePair(step) {
    const idx = chartIndices[activeChartSlot-1];
    const total = chartPairs.length;
    const newIdx = (idx + step + total) % total;
    chartIndices[activeChartSlot-1] = newIdx;
    updateChartPairName();
    drawChart(activeChartSlot);
}

function changeChartInterval(interval, btn) {
    chartIntervals[activeChartSlot-1] = interval;
    highlightIntervalButton(interval);
    drawChart(activeChartSlot);
    startCountdownTimer();
}

async function setChartLayout(count) {
    currentChartLayout = count;
    document.querySelectorAll('.layout-btn').forEach((b, idx) => {
        if (idx === count - 1) b.classList.add('active');
        else b.classList.remove('active');
    });
    const grid = document.getElementById('chart-grid');
    grid.className = 'chart-grid layout-' + count;
    for (let i = 1; i <= 4; i++) {
        const box = document.getElementById('tv_chart_' + i);
        if (i <= count) box.classList.add('active');
        else box.classList.remove('active');
    }
    // Staggered redraw to prevent crash
    await redrawAllActiveStaggered();
    for (let i = 1; i <= 4; i++) {
        const btn = document.getElementById('slotBtn' + i);
        if (i <= count) btn.style.display = 'inline-block';
        else btn.style.display = 'none';
    }
    if (activeChartSlot > count) {
        activeChartSlot = 1;
        for (let i = 1; i <= 4; i++) {
            const btn = document.getElementById('slotBtn' + i);
            if (i === 1) btn.classList.add('active-slot');
            else btn.classList.remove('active-slot');
        }
        updateChartPairName();
        highlightIntervalButton(chartIntervals[0]);
    }
    startCountdownTimer();
}

async function redrawAllActiveStaggered() {
    for (let i = 1; i <= currentChartLayout; i++) {
        drawChart(i);
        if (i < currentChartLayout) {
            await new Promise(resolve => setTimeout(resolve, 100)); // 100ms delay
        }
    }
}

function drawChart(slot) {
    const containerId = 'tv_chart_' + slot;
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    const idx = chartIndices[slot-1];
    if (!chartPairs[idx]) return;
    const symbol = chartPairs[idx];
    const isPSX = typeof psxStockList !== 'undefined' && psxStockList.includes(symbol);
    new TradingView.widget({
        autosize: true,
        symbol: isPSX ? 'KSE:' + symbol : symbol,
        interval: chartIntervals[slot-1],
        theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light',
        container_id: containerId,
        overrides: { "volumePaneSize": "0" },
        studies: [
            { id: "MAExp@tv-basicstudies", inputs: { length: 10 } },
            { id: "MAExp@tv-basicstudies", inputs: { length: 20 } },
            { id: "MASimple@tv-basicstudies", inputs: { length: 50 } }
        ]
    });
}

function closeChart() {
    if (!document.body.classList.contains('desktop-mode')) document.getElementById('chartOverlay').style.display = 'none';
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
}

function toggle4H() {
    show4H = !show4H;
    localStorage.setItem('show4H', show4H ? 'true' : 'false');
    update4hButton();
    render();
}
function update4hButton() {
    const btn = document.getElementById('toggle4hBtn');
    if (show4H) { btn.textContent = '4H ON'; btn.classList.add('active'); }
    else { btn.textContent = '4H OFF'; btn.classList.remove('active'); }
}
(function(){
    const saved = localStorage.getItem('show4H');
    show4H = saved === 'false' ? false : true;
    update4hButton();
})();

db.ref('technicalMetrics').on('value', snap => { techMetrics = snap.val() || {}; renderDebounced(); });
db.ref('sentiment').on('value', snap => { sentimentData = snap.val() || {}; renderDebounced(); });
db.ref('pb_state').on('value', snap => { PB_STATE = snap.val() || {}; updateCounts(); renderDebounced(); });
db.ref('marketData').on('value', snap => {
    MARKET_DATA = snap.val() || {};
    if (typeof checkAllAlerts === 'function') {
        const arr = Object.entries(MARKET_DATA).map(([n,d]) => ({
            name:n, currentPrice:d.currentPrice, ema20:d.ema20, sentiment:d.sentiment, sma20:d.sma20, sma50:d.sma50
        }));
        checkAllAlerts(arr);
    }
    renderDebounced();
});

(function(){
    const saved = localStorage.getItem('ici-theme');
    if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
        document.querySelector('#themeBtn i').className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }
    if (localStorage.getItem('desktop-mode') === 'desktop') {
        document.body.classList.add('desktop-mode');
        document.getElementById('chartOverlay').style.display = 'flex';
        document.querySelector('#desktopBtn i').className = 'fas fa-mobile-alt';
    }
})();
updateToggleButtons();
</script>
